[project]
name = "trymeon"
version = "0.1.0"
description = "버추얼 트라이온 키오스크 SaaS — Phase 0 골격 (TryOnEngine 계약 + 큐 + 더미 워커)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "rq>=1.16",
    "redis>=5.0",
    "pillow>=10.3",
]

[project.optional-dependencies]
# Phase 0에서 맥 로컬로 만져볼 가벼운 전처리 조각 (의류 배경 제거)
preprocess = [
    "rembg>=2.0.57",
    "onnxruntime>=1.18",
]
# Step 3 학습용: 맥(MPS)에서 SD1.5 inpaint 1회 실행 (experiments/sd_inpaint_smoke.py)
learn = [
    "torch>=2.3",
    "diffusers>=0.29",
    "transformers>=4.41",
    "accelerate>=0.30",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "backend", "worker"]
